<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vera AI | Message Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 40% 20%, hsla(253,100%,74%,0.15) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,0.15) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(333,100%,53%,0.15) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }
        .primary-btn {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .primary-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }
        .primary-btn:hover::after {
            opacity: 1;
        }
        .primary-btn span {
            position: relative;
            z-index: 2;
        }
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.5);
        }
        .primary-btn:active {
            transform: translateY(0);
        }
        .loader {
            border-top-color: transparent;
            border-right-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .tag-badge {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
        }
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center">

    <!-- Top Left Logo -->
    <div class="fixed top-6 left-6 z-50 flex items-center gap-3">
        <img src="/logo.png" alt="Vera AI Logo" class="w-12 h-12 rounded-xl shadow-lg border border-purple-500/30">
        <span class="text-xl font-bold tracking-tight text-white hidden md:block">Vera <span class="text-purple-400">AI</span></span>
    </div>

    <div class="max-w-6xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Header Section (Full width) -->
        <div class="lg:col-span-12 text-center mb-4">
            <h1 class="text-4xl md:text-5xl font-bold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-500">
                AI Message Engine
            </h1>
            <p class="text-slate-400 text-lg">Generate high-converting, context-aware marketing messages instantly.</p>
        </div>

        <!-- Auto-Detected Context Banner (Full Width) -->
        <div id="contextBanner" class="lg:col-span-12 hidden bg-slate-800/60 border border-purple-500/30 rounded-2xl px-5 py-3 backdrop-blur-sm mb-2"></div>

        <!-- Left Column: Input Form -->
        <div class="lg:col-span-5 glass-panel rounded-2xl p-6 md:p-8">
            <h2 class="text-xl font-semibold mb-6 flex items-center text-purple-300">
                <i class="fas fa-sliders-h mr-3"></i> Campaign Parameters
            </h2>
            
            <form id="messageForm" class="space-y-5">
                
                <!-- Category -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Business Category</label>
                    <div class="relative">
                        <select id="category" class="input-field w-full rounded-lg px-4 py-3 appearance-none cursor-pointer">
                            <option value="restaurant">Restaurant</option>
                            <option value="salon">Salon & Spa</option>
                            <option value="grocery">Grocery & Mart</option>
                            <option value="fashion">Fashion & Retail</option>
                            <option value="generic">Other / General</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Merchant Name -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Merchant Name</label>
                    <input type="text" id="merchant_name" placeholder="e.g., The Burger Joint" class="input-field w-full rounded-lg px-4 py-3" required>
                </div>

                <!-- Offer Details -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Current Offer</label>
                    <input type="text" id="offer" placeholder="e.g., 20% OFF, Buy 1 Get 1" class="input-field w-full rounded-lg px-4 py-3" required>
                </div>

                <!-- Trigger -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Timing / Trigger</label>
                    <div class="relative">
                        <select id="trigger" class="input-field w-full rounded-lg px-4 py-3 appearance-none cursor-pointer">
                            <option value="weekend">Weekend Special</option>
                            <option value="low sales">Low Sales Today</option>
                            <option value="lunch time">Lunch Time</option>
                            <option value="rain">Rainy Day</option>
                            <option value="payday">Payday</option>
                            <option value="festival">Festival / Holiday</option>
                            <option value="default">General Broadcast</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Customer Context -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Customer Context (Optional)</label>
                    <div class="relative">
                            <select id="customer_context" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all appearance-none cursor-pointer">
                                <option value="default">General Audience</option>
                                <option value="new user">New User</option>
                                <option value="repeat">Repeat Customer</option>
                                <option value="high spender">High Spender (VIP)</option>
                                <option value="inactive">Inactive User</option>
                            </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Tone / Style -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Brand Tone / Style</label>
                    <div class="relative">
                            <select id="tone_style" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all appearance-none cursor-pointer">
                                <option value="default">Standard</option>
                                <option value="genz">GenZ (Fun & Emojis)</option>
                                <option value="hinglish">Local Indian (Hinglish)</option>
                                <option value="professional">Professional (Formal)</option>
                            </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="primary-btn w-full rounded-lg px-6 py-4 font-semibold text-white mt-4 flex items-center justify-center group">
                    <span>Generate Messages</span>
                    <i class="fas fa-wand-magic-sparkles ml-2 group-hover:rotate-12 transition-transform"></i>
                </button>
            </form>
        </div>

        <!-- Right Column: Results -->
        <div class="lg:col-span-7 flex flex-col h-full">
            
            <!-- Empty State -->
            <div id="emptyState" class="glass-panel rounded-2xl flex-1 flex flex-col items-center justify-center p-12 text-center border-dashed border-2 border-slate-600/50">
                <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-6 shadow-inner">
                    <i class="fas fa-robot text-3xl text-slate-400"></i>
                </div>
                <h3 class="text-xl font-medium text-slate-300 mb-2">Awaiting Parameters</h3>
                <p class="text-slate-500 max-w-sm">Enter your campaign details on the left and hit generate to see the AI magic happen.</p>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="glass-panel rounded-2xl flex-1 flex flex-col items-center justify-center p-12 hidden">
                <div class="w-16 h-16 border-4 border-purple-500 border-solid rounded-full loader mb-6"></div>
                <h3 class="text-lg font-medium text-purple-300 animate-pulse">Crafting perfect messages</h3>
            </div>

            <!-- Results State -->
            <div id="resultsState" class="hidden space-y-6">
                <!-- Dynamically populated by app.js -->
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center">
        <i class="fas fa-check-circle mr-2"></i>
        <span>Copied to clipboard!</span>
    </div>

    <script src="/app.js"></script>
</body>
</html>
